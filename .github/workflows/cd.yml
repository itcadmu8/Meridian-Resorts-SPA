name: Continuous Delivery & Deployment (CD)

on:
  push:
    branches:
      - main
      - pre-production
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment to deploy'
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

# Ensure only one deployment runs at a time per environment
concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
      backend_image: ${{ steps.vars.outputs.backend_image }}
      frontend_image: ${{ steps.vars.outputs.frontend_image }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compute Image Metadata
        id: vars
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          REPO_OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          BACKEND_NAME="ghcr.io/${REPO_OWNER_LOWER}/meridian-backend"
          FRONTEND_NAME="ghcr.io/${REPO_OWNER_LOWER}/meridian-frontend"
          
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "backend_image=${BACKEND_NAME}:${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${FRONTEND_NAME}:${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "backend_base=${BACKEND_NAME}" >> "$GITHUB_OUTPUT"
          echo "frontend_base=${FRONTEND_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker Metadata (Backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.backend_base }}
          tags: |
            type=sha,format=short,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Extract Docker Metadata (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.frontend_base }}
          tags: |
            type=sha,format=short,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging (Pre-Production)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: |
      (github.ref == 'refs/heads/pre-production') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    environment:
      name: staging
      url: ${{ steps.set_url.outputs.staging_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Staging URL
        id: set_url
        run: |
          STAGING_URL="${{ vars.APP_URL || 'http://staging.meridianresorts.com' }}"
          echo "staging_url=${STAGING_URL}" >> "$GITHUB_OUTPUT"

      # --- AWS EC2 Deployment via SSH ---
      - name: Deploy to AWS EC2 Staging
        if: env.AWS_SSH_HOST != ''
        env:
          AWS_SSH_HOST: ${{ secrets.STAGING_EC2_HOST }}
          AWS_SSH_USER: ${{ secrets.STAGING_EC2_USER || 'ubuntu' }}
          AWS_SSH_KEY: ${{ secrets.STAGING_EC2_SSH_KEY }}
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build-and-push.outputs.frontend_image }}
        run: |
          mkdir -p ~/.ssh
          echo "$AWS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          echo "Deploying to Staging EC2 host: $AWS_SSH_HOST..."
          ssh -o StrictHostKeyChecking=no "$AWS_SSH_USER@$AWS_SSH_HOST" \
            "mkdir -p ~/app"
          
          scp -o StrictHostKeyChecking=no docker-compose.prod.yml "$AWS_SSH_USER@$AWS_SSH_HOST:~/app/docker-compose.prod.yml"

          ssh -o StrictHostKeyChecking=no "$AWS_SSH_USER@$AWS_SSH_HOST" "
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin && \
            cd ~/app && \
            export BACKEND_IMAGE='${BACKEND_IMAGE}' && \
            export FRONTEND_IMAGE='${FRONTEND_IMAGE}' && \
            export POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}' && \
            export DATABASE_URL='${{ secrets.DATABASE_URL }}' && \
            export MONGO_URL='${{ secrets.MONGO_URL }}' && \
            export OPENAI_API_KEY='${{ secrets.OPENAI_API_KEY }}' && \
            export AUTH_SECRET='${{ secrets.AUTH_SECRET }}' && \
            docker compose -f docker-compose.prod.yml pull && \
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
          "

      # --- Azure App Service Deployment (Alternative Target) ---
      - name: Deploy to Azure App Service Staging
        if: env.AZURE_WEBAPP_NAME != ''
        env:
          AZURE_WEBAPP_NAME: ${{ secrets.AZURE_STAGING_APP_NAME }}
          AZURE_PUBLISH_PROFILE: ${{ secrets.AZURE_STAGING_PUBLISH_PROFILE }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_STAGING_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_STAGING_PUBLISH_PROFILE }}
          images: ${{ needs.build-and-push.outputs.backend_image }}

      - name: Verify Staging Health Check
        env:
          HEALTH_URL: ${{ vars.STAGING_HEALTH_URL || 'http://localhost:8000/health' }}
        run: |
          echo "Validating health check at: $HEALTH_URL"
          if [[ "$HEALTH_URL" =~ ^https?:// ]]; then
            for i in {1..10}; do
              RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || true)
              if [ "$RESPONSE" = "200" ]; then
                echo "Health check PASSED for staging!"
                exit 0
              fi
              echo "Waiting for health check... HTTP $RESPONSE (Attempt $i/10)"
              sleep 6
            done
            echo "Health check FAILED for staging (HTTP $RESPONSE)"
            exit 1
          else
            echo "Health check URL not configured. Skipping remote curl check."
          fi

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: |
      (github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    environment:
      name: production
      url: ${{ steps.set_url.outputs.prod_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Production URL
        id: set_url
        run: |
          PROD_URL="${{ vars.APP_URL || 'https://meridianresorts.com' }}"
          echo "prod_url=${PROD_URL}" >> "$GITHUB_OUTPUT"

      # --- AWS EC2 Deployment via SSH ---
      - name: Deploy to AWS EC2 Production
        if: env.AWS_SSH_HOST != ''
        env:
          AWS_SSH_HOST: ${{ secrets.PROD_EC2_HOST }}
          AWS_SSH_USER: ${{ secrets.PROD_EC2_USER || 'ubuntu' }}
          AWS_SSH_KEY: ${{ secrets.PROD_EC2_SSH_KEY }}
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build-and-push.outputs.frontend_image }}
        run: |
          mkdir -p ~/.ssh
          echo "$AWS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          echo "Deploying immutable image ($BACKEND_IMAGE) to Production EC2..."
          ssh -o StrictHostKeyChecking=no "$AWS_SSH_USER@$AWS_SSH_HOST" \
            "mkdir -p ~/app"
          
          scp -o StrictHostKeyChecking=no docker-compose.prod.yml "$AWS_SSH_USER@$AWS_SSH_HOST:~/app/docker-compose.prod.yml"

          ssh -o StrictHostKeyChecking=no "$AWS_SSH_USER@$AWS_SSH_HOST" "
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin && \
            cd ~/app && \
            export BACKEND_IMAGE='${BACKEND_IMAGE}' && \
            export FRONTEND_IMAGE='${FRONTEND_IMAGE}' && \
            export POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}' && \
            export DATABASE_URL='${{ secrets.DATABASE_URL }}' && \
            export MONGO_URL='${{ secrets.MONGO_URL }}' && \
            export OPENAI_API_KEY='${{ secrets.OPENAI_API_KEY }}' && \
            export AUTH_SECRET='${{ secrets.AUTH_SECRET }}' && \
            docker compose -f docker-compose.prod.yml pull && \
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
          "

      # --- Azure App Service Deployment (Alternative Target) ---
      - name: Deploy to Azure App Service Production
        if: env.AZURE_WEBAPP_NAME != ''
        env:
          AZURE_WEBAPP_NAME: ${{ secrets.AZURE_PROD_APP_NAME }}
          AZURE_PUBLISH_PROFILE: ${{ secrets.AZURE_PROD_PUBLISH_PROFILE }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_PROD_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_PROD_PUBLISH_PROFILE }}
          images: ${{ needs.build-and-push.outputs.backend_image }}

      - name: Verify Production Health Check
        env:
          HEALTH_URL: ${{ vars.PROD_HEALTH_URL || 'http://localhost:8000/health' }}
        run: |
          echo "Validating health check at: $HEALTH_URL"
          if [[ "$HEALTH_URL" =~ ^https?:// ]]; then
            for i in {1..12}; do
              RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || true)
              if [ "$RESPONSE" = "200" ]; then
                echo "Health check PASSED for production! Service is live and healthy."
                exit 0
              fi
              echo "Waiting for health check... HTTP $RESPONSE (Attempt $i/12)"
              sleep 5
            done
            echo "Health check FAILED for production (HTTP $RESPONSE). Initiate rollback if needed."
            exit 1
          else
            echo "Health check URL not configured. Skipping remote curl check."
          fi
