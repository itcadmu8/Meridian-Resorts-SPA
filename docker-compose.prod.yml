version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: meridian_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-meridian}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meridian"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:6-alpine
    container_name: meridian_mongo_prod
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_prod:/data/db

  backend:
    image: ${BACKEND_IMAGE}
    container_name: meridian_backend_prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - MONGO_URL=${MONGO_URL:-mongodb://mongo:27017}
      - MONGO_DB_NAME=${MONGO_DB_NAME:-Meridian-Resorts}
      - SEED_ON_STARTUP=${SEED_ON_STARTUP:-true}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-["*"]}
      - AUTH_SECRET=${AUTH_SECRET:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: meridian_frontend_prod
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
    depends_on:
      - backend

volumes:
  postgres_data_prod:
  mongo_data_prod:
